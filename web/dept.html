<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A부 국회 요구자료 · 현업 회신</title>
  <style>
    :root{--ink:#182230;--muted:#667085;--line:#d8e1e8;--panel:#fff;--bg:#f3f6f9;--navy:#12355b;--blue:#1769aa;--mint:#0f8a78;--orange:#b45309;--red:#b42318;--soft:#eaf2f8;--radius:16px;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef4f8 0,#f7f9fb 360px,var(--bg) 100%)}button,input,select,textarea{font:inherit}a{color:inherit}
    .app-nav{min-height:72px;padding:12px max(24px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;color:var(--navy)}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--navy);color:white}.nav-links{display:flex;gap:5px}.nav-link{border:0;background:transparent;text-decoration:none;padding:10px 13px;border-radius:10px;color:#475467;font:inherit;font-weight:700;display:flex;align-items:center;gap:6px}.nav-link.is-active{background:var(--soft);color:var(--navy)}.nav-link.is-future{opacity:.52}.nav-link small{font-size:10px;color:#7b8794}.storage-badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.storage-badge.server{background:#e8f6f2;color:#087364}.storage-badge.local{background:#fff4e5;color:#9a4f00}
    main{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:36px 0 80px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.page-head h1{margin:0 0 8px;font-size:clamp(28px,4vw,36px);letter-spacing:-.035em;color:#102a43}.page-head p{margin:0;color:var(--muted);line-height:1.6}.panel,.reply-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 40px rgba(35,62,83,.07)}.panel{padding:22px 24px;margin-bottom:20px}.panel h2{font-size:19px;margin:0 0 5px}.panel p{margin:0;color:var(--muted);font-size:14px}.picker-row{display:grid;grid-template-columns:minmax(220px,360px) 1fr;align-items:end;gap:14px;margin-top:18px}.field{display:grid;gap:7px}.field label,.field-label{font-size:13px;font-weight:800;color:#475467}.field input,.field select,.field textarea,.field select{width:100%;border:1px solid #b8c5d0;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:78px;resize:vertical;line-height:1.5}.hint{font-size:12px;color:var(--muted)}
    .message{padding:11px 13px;border-radius:10px;background:#edf4f8;color:var(--navy);font-size:14px;line-height:1.5}.message[data-kind=success]{background:#e8f6f2;color:#087364}.message[data-kind=error]{background:#fff0ee;color:var(--red)}.cards{display:grid;gap:16px}.reply-card{padding:21px 22px;animation:card-in .3s cubic-bezier(.2,.7,.2,1) both}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.state{display:inline-flex;padding:5px 9px;border-radius:999px;background:#fff4e5;color:#9a4f00;font-size:12px;font-weight:900;white-space:nowrap}.state.done{background:#e7f6f1;color:#087364}.case-title{font-size:18px;font-weight:850;color:#263b4e;margin:0 0 5px}.meta{color:var(--muted);font-size:13px}.request-text{font-size:15px;line-height:1.65;margin:12px 0}.subtext{color:var(--muted);font-size:13px;line-height:1.6}.history-box{margin-top:13px;padding:12px;border-radius:11px;background:#fbfdfe;border:1px solid #e4edf2;font-size:12px;line-height:1.55}.history-box b{color:var(--navy)}.history-box ul{padding-left:18px;margin:7px 0 0}.history-box li+li{margin-top:5px}.history-box small{color:var(--muted)}.reply-grid{display:grid;grid-template-columns:minmax(220px,.9fr) 1.1fr;gap:12px;margin-top:17px}.section-label{font-size:13px;font-weight:850;color:var(--navy);margin:19px 0 10px}.reassign-grid{display:grid;grid-template-columns:1fr minmax(200px,.7fr);gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.button{border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s}.button.primary{background:var(--navy);color:#fff}.button.secondary{background:#fff;border-color:#b9c7d3;color:var(--navy)}.button:disabled{opacity:.5;cursor:not-allowed}.button:active{transform:scale(.97)}.empty{padding:36px 20px;text-align:center;border:1px dashed #b9c7d3;border-radius:14px;background:#fbfdfe;color:var(--muted);line-height:1.7}.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.loading::before{content:"";width:14px;height:14px;border:2px solid #d5e1e9;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite}
    .validation-result{margin-top:14px;padding:13px 15px;border:1px solid #c8e7df;border-radius:11px;background:#f1faf7;color:#087364;font-size:13px;line-height:1.55}.validation-result.warn{border-color:#f3d3a6;background:#fff8ed;color:#8a4b08}.validation-result ul{margin:7px 0;padding-left:20px}.validation-result li{animation:check-in .24s ease both;animation-delay:calc(var(--issue-index,0) * 45ms)}.validation-result li+li{margin-top:4px}
    @keyframes card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes check-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(hover:hover) and (pointer:fine){.button:not(:disabled):hover{transform:translateY(-2px)}}:focus-visible{outline:3px solid #72b6e6;outline-offset:3px}
    @media(max-width:760px){.app-nav{align-items:flex-start;flex-wrap:wrap;padding:12px 18px}.brand span:last-child{display:none}.nav-links{max-width:72vw;overflow:auto}.nav-link{white-space:nowrap}.storage-badge{margin-left:auto}.page-head{align-items:flex-start;flex-direction:column}.panel{padding:18px}.picker-row,.reply-grid,.reassign-grid{grid-template-columns:1fr}.reply-card{padding:18px}.card-head{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header data-app-nav></header>
  <main>
    <div class="page-head"><div><h1>현업 회신</h1><p>내 과에 배분된 문항만 확인하고 회신 또는 재배정 요청을 등록합니다.</p></div></div>
    <section class="panel" aria-labelledby="department-title">
      <h2 id="department-title">담당 과 선택</h2><p>조직도에 등록된 과만 선택할 수 있습니다.</p>
      <div class="picker-row"><div class="field"><label for="department">내 과</label><select id="department"><option value="">과를 선택하세요</option></select></div><div id="page-message" class="message" role="status" hidden></div></div>
    </section>
    <section aria-label="배분된 문항"><div id="cards" class="cards"><div class="empty">내 과를 선택하면 배분된 문항을 표시합니다.</div></div></section>
  </main>
  <script src="lib/papaparse.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="flow.js"></script>
  <script src="validate.js"></script>
  <script src="common.js"></script>
  <script>
    AppCommon.initNav("dept");
    const departmentSelect = document.querySelector("#department");
    const cards = document.querySelector("#cards");
    const pageMessage = document.querySelector("#page-message");
    let departments = [];
    let cases = [];
    let historyRows = [];
    const replyDrafts = new Map();

    function parseReplyFile(file) {
      return file.arrayBuffer().then(buffer => {
        const workbook = XLSX.read(buffer, { type: "array", cellDates: false });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
      });
    }

    function validationHtml(issues) {
      if (!issues || !issues.length) return '<div class="validation-result"><b>자동 점검 통과</b> · 1행 요구 표시, 2행 머리글, 연도·금액·합계 확인</div>';
      const list = issues.map((issue, index) => '<li style="--issue-index:' + index + '">' + AppCommon.escapeHtml(issue) + "</li>").join("");
      return '<div class="validation-result warn"><b>확인필요 · ' + issues.length + '건</b><ul>' + list + '</ul><small>제출 전에 항목을 확인해 주세요.</small></div>';
    }

    function assignedTo(item, department) {
      return item.주관과 === department || (Array.isArray(item.협조과) && item.협조과.includes(department));
    }

    function draftKey(id, department) {
      return id + "::" + department;
    }

    function historyHtml(item) {
      const keywords = item.후보?.[0]?.근거키워드 || [];
      const history = AppCommon.findHistory(keywords, historyRows);
      const recent = history.recent.length
        ? `<ul>${history.recent.map(row => `<li>${AppCommon.escapeHtml(row.접수일)} · ${AppCommon.escapeHtml(row.배분과)} · ${AppCommon.escapeHtml(row.요구내용)}</li>`).join("")}</ul>`
        : "<small>해당 키워드가 든 과거 요구가 없습니다.</small>";
      return `<div class="history-box"><b>과거 이력 · ${history.count}건 · 주로 ${AppCommon.escapeHtml(history.department)}</b>${recent}</div>`;
    }

    function render() {
      const department = departmentSelect.value;
      if (!department) {
        cards.innerHTML = '<div class="empty">내 과를 선택하면 배분된 문항을 표시합니다.</div>';
        return;
      }
      const list = cases.filter(item => assignedTo(item, department));
      if (!list.length) {
        cards.innerHTML = `<div class="empty">${AppCommon.escapeHtml(department)}에 배분된 문항이 없습니다.</div>`;
        return;
      }
      cards.innerHTML = list.map((item, index) => {
        const reply = item["과별 회신"]?.[department];
        const alreadyReplied = Boolean(reply);
        const reassignable = ["배분확정", "회신중", "보완요청"].includes(item.상태);
        return `<article class="reply-card" style="animation-delay:${index * 35}ms" data-id="${AppCommon.escapeHtml(item.id)}">
          <div class="card-head"><div><p class="case-title">${AppCommon.escapeHtml(item.의원)} · ${AppCommon.escapeHtml(item.문항번호)}번</p><div class="meta">${AppCommon.escapeHtml(item.위원회)} · 제출기한 ${AppCommon.escapeHtml(item.제출기한 || "미기재")}</div></div><span class="state ${item.상태 === "회신완료" ? "done" : ""}">${AppCommon.escapeHtml(item.상태)}</span></div>
          <div class="request-text">${AppCommon.escapeHtml(item.요구내용)}</div>${item.세부항목 ? `<div class="subtext">세부항목: ${AppCommon.escapeHtml(item.세부항목)}</div>` : ""}${item.비고 ? `<div class="subtext">비고: ${AppCommon.escapeHtml(item.비고)}</div>` : ""}
          <div class="subtext">주관 과: ${AppCommon.escapeHtml(item.주관과)}${item.협조과?.length ? ` · 협조 과: ${AppCommon.escapeHtml(item.협조과.join(", "))}` : ""}</div>
          ${historyHtml(item)}
          ${alreadyReplied ? `<p class="message" style="margin-top:13px">회신 제출됨${reply.메모 ? ` · ${AppCommon.escapeHtml(reply.메모)}` : ""}</p>` : ""}
          <div class="reply-grid"><div class="field"><label for="file-${index}">회신 엑셀 올리기</label><input id="file-${index}" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" data-reply-file></div><div class="field"><label for="memo-${index}">메모</label><textarea id="memo-${index}" data-reply-memo placeholder="자료 없음 등 회신 메모"></textarea></div></div>
          <div class="actions"><button class="button primary" type="button" data-submit-reply ${alreadyReplied || !reassignable ? "disabled" : ""}>회신 제출</button></div>
          <div class="section-label">소관이 아닌 경우 재배정 요청</div>
          <div class="reassign-grid"><div class="field"><label for="reason-${index}">재배정 사유</label><textarea id="reason-${index}" data-reassign-reason placeholder="재배정이 필요한 이유를 입력하세요"></textarea></div><div class="field"><label for="hope-${index}">희망 과</label><select id="hope-${index}" data-reassign-hope><option value="">희망 과 선택</option>${departments.map(name => `<option value="${AppCommon.escapeHtml(name)}">${AppCommon.escapeHtml(name)}</option>`).join("")}</select></div></div>
          <div class="actions"><button class="button secondary" type="button" data-submit-reassign ${reassignable ? "" : "disabled"}>재배정 요청</button></div>
        </article>`;
      }).join("");
      list.forEach(item => {
        const card = [...cards.querySelectorAll(".reply-card")].find(element => element.dataset.id === item.id);
        if (!card) return;
        const reply = item["과별 회신"]?.[department];
        const supplementRequested = item.상태 === "보완요청" && item.보완?.과?.includes(department);
        const submitButton = card.querySelector("[data-submit-reply]");
        if (supplementRequested) {
          submitButton.disabled = false;
          submitButton.textContent = "보완 회신 제출";
        }
        const memo = card.querySelector("[data-reply-memo]");
        if (reply && memo) memo.value = reply.메모 || "";
        const draft = replyDrafts.get(draftKey(item.id, department));
        const issues = draft ? draft.issues : reply?.확인필요 || [];
        const result = document.createElement("div");
        result.dataset.validationResult = "";
        if (draft || reply) result.innerHTML = validationHtml(issues);
        card.querySelector(".reply-grid").after(result);
      });
    }

    async function refresh() {
      cases = await AppCommon.getCases();
      render();
    }

    cards.addEventListener("change", async event => {
      const input = event.target.closest("[data-reply-file]");
      if (!input) return;
      const card = input.closest("[data-id]");
      const item = cases.find(row => row.id === card?.dataset.id);
      const file = input.files[0];
      if (!item || !file) return;
      const result = card.querySelector("[data-validation-result]");
      result.innerHTML = '<div class="loading" role="status">회신 엑셀을 점검하고 있습니다.</div>';
      try {
        const rows = await parseReplyFile(file);
        const issues = Validate.validateReply(rows, item.요구내용);
        replyDrafts.set(draftKey(item.id, departmentSelect.value), { fileName: file.name, size: file.size, lastModified: file.lastModified, rows, issues });
        result.innerHTML = validationHtml(issues);
      } catch (error) {
        replyDrafts.delete(draftKey(item.id, departmentSelect.value));
        result.innerHTML = '<div class="validation-result warn">엑셀을 읽지 못했습니다: ' + AppCommon.escapeHtml(error.message) + "</div>";
      }
    });

    cards.addEventListener("click", async event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      const item = cases.find(row => row.id === card.dataset.id);
      const department = departmentSelect.value;
      try {
        if (event.target.closest("[data-submit-reply]")) {
          const file = card.querySelector("[data-reply-file]").files[0];
          if (!file) throw new Error("회신 엑셀을 선택하세요.");
          const key = draftKey(item.id, department);
          let draft = replyDrafts.get(key);
          if (!draft || draft.fileName !== file.name || draft.size !== file.size || draft.lastModified !== file.lastModified) {
            const rows = await parseReplyFile(file);
            draft = { fileName: file.name, size: file.size, lastModified: file.lastModified, rows, issues: Validate.validateReply(rows, item.요구내용) };
            replyDrafts.set(key, draft);
            card.querySelector("[data-validation-result]").innerHTML = validationHtml(draft.issues);
          }
          if (draft.issues.length && !confirm("자동 점검에서 확인필요 " + draft.issues.length + "건을 찾았습니다. 항목을 확인했으면 제출을 계속할까요?\n\n" + draft.issues.slice(0, 5).join("\n"))) return;
          await AppCommon.applyFlow(cases, { 작업: "회신", id: item.id, 과: department, 파일명: file.name, 행: draft.rows, 메모: card.querySelector("[data-reply-memo]").value.trim(), 확인필요: draft.issues }, departments);
          replyDrafts.delete(key);
          await refresh();
          AppCommon.setMessage(pageMessage, `${item.의원} ${item.문항번호}번 회신을 제출했습니다.`, "success");
        }
        if (event.target.closest("[data-submit-reassign]")) {
          const reason = card.querySelector("[data-reassign-reason]").value.trim();
          const hope = card.querySelector("[data-reassign-hope]").value;
          if (!reason) throw new Error("재배정 사유를 입력하세요.");
          if (!hope) throw new Error("희망 과를 선택하세요.");
          await AppCommon.applyFlow(cases, { 작업: "재배정요청", id: item.id, 과: department, 사유: reason, 희망과: hope }, departments);
          await refresh();
          AppCommon.setMessage(pageMessage, `${item.의원} ${item.문항번호}번 재배정을 요청했습니다.`, "success");
        }
      } catch (error) {
        AppCommon.setMessage(pageMessage, error.message, "error");
      }
    });

    departmentSelect.addEventListener("change", render);
    window.addEventListener("cases-saved", () => refresh().catch(error => AppCommon.setMessage(pageMessage, error.message, "error")));
    (async function init() {
      cards.innerHTML = '<div class="loading" role="status">조직도와 문항을 불러오는 중입니다.</div>';
      try {
        departments = (await AppCommon.fetchCsv("data/A부_조직도_26개과.csv")).map(row => row.과.trim());
        departmentSelect.insertAdjacentHTML("beforeend", departments.map(name => `<option value="${AppCommon.escapeHtml(name)}">${AppCommon.escapeHtml(name)}</option>`).join(""));
        historyRows = await AppCommon.loadHistory();
        await refresh();
      } catch (error) {
        cards.innerHTML = '<div class="empty">자료를 불러오지 못했습니다.</div>';
        AppCommon.setMessage(pageMessage, error.message, "error");
      }
    })();
  </script>
</body>
</html>
